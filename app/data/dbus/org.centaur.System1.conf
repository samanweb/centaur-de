<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root may own the name. -->
  <policy user="root">
    <allow own="org.centaur.System1"/>
  </policy>

  <!-- Anyone may call it. Every method that changes state checks polkit
       before acting, so the bus policy is deliberately permissive and the
       authorisation decision lives in one place. -->
  <policy context="default">
    <allow send_destination="org.centaur.System1"/>
    <allow send_destination="org.centaur.System1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.centaur.System1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

</busconfig>
